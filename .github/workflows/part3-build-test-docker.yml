name: Part 3 - Build, Test and Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build API and MVC website, run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          SOLUTION=$(find . -maxdepth 4 \( -name '*.sln' -o -name '*.slnx' \) | head -n 1)
          API_PROJECT=$(find . -name 'RaceDay.Api.csproj' | head -n 1)
          WEB_PROJECT=$(find . -name 'RaceDay.Web.csproj' | head -n 1)
          TEST_PROJECT=$(find . -name 'RaceDay.Api.Tests.csproj' | head -n 1)
          test -n "$SOLUTION" || { echo "::error::No solution file (.sln or .slnx) found"; exit 1; }
          test -n "$API_PROJECT" || { echo "::error::API project (RaceDay.Api.csproj) not found"; exit 1; }
          test -n "$WEB_PROJECT" || { echo "::error::MVC website project (RaceDay.Web.csproj) not found"; exit 1; }
          test -n "$TEST_PROJECT" || { echo "::error::Test project (RaceDay.Api.Tests.csproj) not found"; exit 1; }
          test -d "$(dirname "$API_PROJECT")/Migrations" || { echo "::error::EF Core Migrations folder not found"; exit 1; }
          test -f "$(dirname "$API_PROJECT")/Dockerfile" || { echo "::error::API Dockerfile not found"; exit 1; }
          test -f "$(dirname "$WEB_PROJECT")/Dockerfile" || { echo "::error::Website Dockerfile not found"; exit 1; }
          test -f docker-compose.yml || { echo "::error::docker-compose.yml not found at the repository root"; exit 1; }
          if [ -f .env ]; then echo "::error::.env holds secrets and must not be committed"; exit 1; fi
          if git grep -I -q "AccountKey=" -- . ':!*.md' ':!.github' ':!.env.example'; then
            echo "::error::An Azure storage key appears to be committed. Remove it and regenerate the key in the Azure portal."
            exit 1
          fi
          if [ ! -f README.md ]; then echo "::warning::README.md not found at repository root"; fi
          {
            echo "SOLUTION=$SOLUTION"
            echo "API_PROJECT=$API_PROJECT"
            echo "WEB_PROJECT=$WEB_PROJECT"
            echo "TEST_PROJECT=$TEST_PROJECT"
          } >> "$GITHUB_ENV"
          echo "Solution: $SOLUTION"
          echo "Repository structure OK."

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION"

      - name: Build API
        run: dotnet build "$API_PROJECT" --configuration Release --no-restore

      - name: Build MVC website
        run: dotnet build "$WEB_PROJECT" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test "$TEST_PROJECT" --configuration Release --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  docker-build:
    name: Build the Docker images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docker-compose.yml is valid
        run: docker compose config --quiet

      - name: Build the API and website images
        run: docker compose build
